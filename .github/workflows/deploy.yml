name: Online cache update

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency: online-cache-update

jobs:
  run:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write  # for writing to the cache
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          path: main
      - name: Checkout windhawk-mods
        uses: actions/checkout@v6
        id: checkout-windhawk-mods
        with:
          repository: ramensoftware/windhawk-mods
          ref: pages
          path: windhawk-mods
          sparse-checkout: |
            /mods/*.wh.cpp
            /mods/*/*.wh.cpp
            /mods/*/versions.json
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'main/.github/requirements.txt'
      - name: Install Python dependencies
        run: python -m pip install -r main/.github/requirements.txt

      # A cache entry can't be overwritten, so each save gets a new key, and the
      # newest entry is restored by prefix.
      - name: Restore cache - binaries and symbols
        uses: actions/cache/restore@v5
        id: cache-binaries-and-symbols
        with:
          path: binaries
          key: cache-binaries-and-symbols-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cache-binaries-and-symbols-v2-

      # The hash covers modification times as well, since an addresses file is
      # written again by script 04 under the same name.
      - name: Calculate cache hash (before)
        id: cache-hash-before
        run: |
          echo "hash=$(find binaries -type f -printf '%p %T@\n' | sort | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Rename cache folder
        if: ${{ steps.cache-binaries-and-symbols.outputs.cache-matched-key != '' }}
        run: mv binaries binaries_previous

      - name: Run 01_extract_mod_symbols
        run: |
          python -u main/scripts/01_extract_mod_symbols.py \
            windhawk-mods/mods \
            extracted_symbols.json
      - name: Run 02_download_binaries
        run: |
          python -u main/scripts/02_download_binaries.py \
            extracted_symbols.json \
            binaries \
            binaries_previous \
            winbindex
      - name: Run 03_extract_symbols_from_binaries
        run: |
          python -u main/scripts/03_extract_symbols_from_binaries.py \
            binaries \
            main/scripts/tools/windhawk-symbol-helper.exe \
            main/scripts/tools \
            symbols

      - name: Calculate cache hash (after)
        id: cache-hash-after
        run: |
          echo "hash=$(find binaries -type f -printf '%p %T@\n' | sort | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache changed?
        id: cache-changed
        run: |
          if [ "${{ steps.cache-hash-before.outputs.hash }}" = "${{ steps.cache-hash-after.outputs.hash }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Last deploy commit message changed?
        id: last-deploy-commit-message-changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          msg=$(curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/$REPO/commits/gh-pages \
            | jq -r '.commit.message | split("\n")[0]')
          echo "$msg"
          if [ "$msg" = "deploy: ${{ github.sha }}, mods@${{ steps.checkout-windhawk-mods.outputs.commit }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run 04_create_mod_cache
        if: >-
          ${{
            steps.cache-changed.outputs.changed == 'true' ||
            steps.last-deploy-commit-message-changed.outputs.changed == 'true'
          }}
        run: |
          python -u main/scripts/04_create_mod_cache.py \
            binaries \
            extracted_symbols.json \
            symbol_cache.fi

      - name: Run 05_create_status
        if: >-
          ${{
            steps.cache-changed.outputs.changed == 'true' ||
            steps.last-deploy-commit-message-changed.outputs.changed == 'true'
          }}
        run: |
          python -u main/scripts/05_create_status.py \
            extracted_symbols.json \
            binaries \
            winbindex \
            status.fi

      # The generated files replace the whole tree (deleteall), and the commit is
      # created even if nothing changed, to record what was deployed.
      - name: Deploy
        if: >-
          ${{
            steps.cache-changed.outputs.changed == 'true' ||
            steps.last-deploy-commit-message-changed.outputs.changed == 'true'
          }}
        run: |
          deploy_dir="${{ runner.temp }}/deploy"
          deploy_branch=gh-pages
          message="deploy: ${{ github.sha }}, mods@${{ steps.checkout-windhawk-mods.outputs.commit }}"

          echo Cloning the repository
          git clone --branch $deploy_branch --depth 1 --no-checkout https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git "$deploy_dir"
          echo Committing generated files
          {
            echo "commit refs/heads/$deploy_branch"
            echo "committer github-actions[bot] <github-actions[bot]@users.noreply.github.com> now"
            echo "data $(( ${#message} + 1 ))"
            echo "$message"
            echo "from refs/heads/$deploy_branch^0"
            echo "deleteall"
            cat symbol_cache.fi status.fi
            echo "M 100644 inline .nojekyll"
            echo "data 0"
          } | git -C "$deploy_dir" fast-import --quiet --date-format=now
          echo Pushing to GitHub
          git -C "$deploy_dir" push origin $deploy_branch

      - name: Calculate cache hash (final)
        id: cache-hash-final
        run: |
          echo "hash=$(find binaries -type f -printf '%p %T@\n' | sort | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Save cache - binaries and symbols
        if: ${{ steps.cache-hash-final.outputs.hash != steps.cache-hash-before.outputs.hash }}
        uses: actions/cache/save@v5
        with:
          path: binaries
          key: ${{ steps.cache-binaries-and-symbols.outputs.cache-primary-key }}

      # The save step only warns when it fails, so the older entries are kept
      # unless the new one is listed.
      - name: Delete older caches - binaries and symbols
        if: ${{ steps.cache-hash-final.outputs.hash != steps.cache-hash-before.outputs.hash }}
        env:
          GH_TOKEN: ${{ github.token }}  # required by gh
          REPO: ${{ github.repository }}
          KEY: ${{ steps.cache-binaries-and-symbols.outputs.cache-primary-key }}
        run: |
          caches=$(gh cache list -R "$REPO" --key cache-binaries-and-symbols- --limit 100 --json id,key)
          if [ "$(jq --arg key "$KEY" 'any(.key == $key)' <<< "$caches")" != true ]; then
            echo "::warning::Cache $KEY isn't listed, keeping the older entries"
            exit 0
          fi
          for id in $(jq --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches"); do
            gh cache delete "$id" -R "$REPO"
          done
